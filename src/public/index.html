<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NestChat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>NestChat</h1>
        <button id="new-conversation-btn" class="btn btn-primary">+ New</button>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search messages...">
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="archived">Archived</button>
      </div>

      <div id="conversation-list" class="conversation-list">
        <!-- Conversations loaded dynamically -->
      </div>
    </aside>

    <main class="main-content">
      <div id="welcome-view" class="welcome-view">
        <h2>Welcome to NestChat</h2>
        <p>Select a conversation or start a new one to begin.</p>
      </div>

      <div id="conversation-view" class="conversation-view hidden">
        <div class="conversation-header">
          <div class="conversation-meta">
            <span id="conversation-date" class="conversation-date"></span>
            <div id="tag-chips" class="tag-chips"></div>
          </div>
          <div class="conversation-actions">
            <button id="edit-tags-btn" class="btn btn-secondary btn-sm">Tags</button>
            <button id="archive-btn" class="btn btn-secondary btn-sm">Archive</button>
          </div>
        </div>

        <div id="messages-container" class="messages-container">
          <!-- Messages loaded dynamically -->
        </div>

        <div class="input-area">
          <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
          <button id="send-btn" class="btn btn-primary">Send</button>
        </div>
      </div>

      <div id="search-results-view" class="search-results-view hidden">
        <div class="search-results-header">
          <h2>Search Results</h2>
          <button id="back-to-conversations" class="btn btn-secondary btn-sm">Back</button>
        </div>
        <div id="search-results-list" class="search-results-list">
          <!-- Search results loaded dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- Tag Edit Modal -->
  <div id="tag-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Tags</h3>
      <input type="text" id="tag-input" placeholder="Enter tags (comma separated)">
      <div class="modal-actions">
        <button id="save-tags-btn" class="btn btn-primary">Save</button>
        <button id="cancel-tags-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
